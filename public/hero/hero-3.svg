<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Shree Chamunda Dham Aglod">
  <defs>
    <radialGradient id="g3" cx="58%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#8f1727"/>
      <stop offset="55%" stop-color="#62101f"/>
      <stop offset="100%" stop-color="#340811"/>
    </radialGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d27a"/>
      <stop offset="100%" stop-color="#c99a3a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g3)"/>
  <g opacity="0.2" stroke="url(#gold3)" stroke-width="2" fill="none" transform="translate(900,360)">
    <circle r="250"/><circle r="200"/><circle r="150"/>
  </g>
  <!-- lotus -->
  <g transform="translate(800,470)" fill="url(#gold3)" opacity="0.85">
    <g>
      <path d="M0,0 Q-40,-120 0,-170 Q40,-120 0,0 Z"/>
      <path d="M0,0 Q-40,-120 0,-170 Q40,-120 0,0 Z" transform="rotate(35)"/>
      <path d="M0,0 Q-40,-120 0,-170 Q40,-120 0,0 Z" transform="rotate(-35)"/>
      <path d="M0,0 Q-40,-120 0,-170 Q40,-120 0,0 Z" transform="rotate(70)"/>
      <path d="M0,0 Q-40,-120 0,-170 Q40,-120 0,0 Z" transform="rotate(-70)"/>
    </g>
  </g>
  <text x="800" y="720" text-anchor="middle" font-family="'Noto Sans Gujarati',sans-serif" font-size="58" fill="#f6ead0" font-weight="700">માના ચરણોમાં શ્રદ્ધા</text>
  <text x="800" y="782" text-anchor="middle" font-family="'Noto Sans Gujarati',sans-serif" font-size="42" fill="#e9c98f">સેવા અને સમર્પણ</text>
</svg>
